name: Validate NPC News

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Validate JSON
        run: |
          python -m json.tool data/events.json >/dev/null
          python -m json.tool data/news.json >/dev/null
      - name: Validate Python
        run: python -m py_compile generate.py
      - name: Check generated site
        run: |
          test -f dist/index.html
          test -f dist/app.js
          test -f dist/styles.css
          test -f dist/manifest.webmanifest
          test -f dist/sw.js
